name: deploy
on:
  workflow_dispatch:
    inputs:
      run_job:
        description: "Job a ejecutar"
        required: true
        default: "all"
jobs:
  terraform:
    name: Terraform Apply
    if: false
    runs-on: ubuntu-22.04
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          DO_SPACES_KEY: ${{ secrets.DO_SPACES_KEY }}
          DO_SPACES_SECRET: ${{ secrets.DO_SPACES_SECRET }}
        
      - name: Get Swarm Manager IP
        working-directory: terraform
        id: get_ip
        run: |
          set -euo pipefail
          manager_ip=$(terraform output -raw manager_public_ip)
          curl -u "${{ secrets.DDNS_USERNAME }}:${{ secrets.DDNS_PASSWORD }}" \
            "https://dynupdate.no-ip.com/nic/update?hostname=marketdemo.ddns.net&myip=$manager_ip"


  generate_matrix:
    # needs: [terraform]
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          yq -o=json '
            .services | to_entries | map({
              "service": .key,
              "image": (.value.image | split(":")[0]),
              "tag": ("push-" + .key),
              "prefix": (.key | ascii_upcase)
            })
          ' infra/docker/prod/imagenes.yml > matrix.json
          echo "matrix={\"include\":$(cat matrix.json)}" >> "$GITHUB_OUTPUT"

  build_all:
    needs: [generate_matrix]
    strategy:
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  
      - name: detecta cambios
        run: |
          git fetch --tags --force

          if git rev-parse "${{ matrix.tag }}" >/dev/null 2>&1; then
              BASE="${{ matrix.tag }}"
              echo "Comparando desde el tag $BASE ($(git rev-parse "$BASE"))"
          else
              BASE=$(git hash-object -t tree /dev/null)
              echo "Tag ${{ matrix.tag }} no existe. Primer build."
          fi
          echo "BASE: $BASE"
          echo "HEAD: $(git rev-parse HEAD)"
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)

          if grep -qE "^${{ matrix.pattern }}/" <<< "$CHANGED_FILES"; then
            echo "${{ matrix.prefix }}_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "${{ matrix.prefix }}_CHANGED=false" >> "$GITHUB_ENV"
          fi

          echo "${{ matrix.prefix }}_BUILD=SKIPPED" >> "$GITHUB_ENV"

          echo "Pattern: ^${{ matrix.pattern }}/"
          echo "Changed files:"
          echo "$CHANGED_FILES"

      - name: Build ${{ matrix.service }}
        if: env[format('{0}_CHANGED', matrix.prefix)] == 'true'
        env:
          HOST_EXTERNAL: ${{ vars.MANAGER_IP }}
          VITE_MOCK: ${{ vars.VITE_MOCK }}
          GOOGLE_OAUTH2_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID}}
          PROFILE: ${{ vars.PROFILE }}
        run: |
          BUILD_ENV_KEYS=(
            PROTOCOL_EXTERNAL
            HOST_EXTERNAL
            PROTOCOL_WS_EXTERNAL
            VITE_MOCK
            HOME_PAGE_PATH
          )
          PATTERN=$(IFS='|'; echo "${BUILD_ENV_KEYS[*]}")
          set -a
            source <(grep -E "^(${PATTERN})=" infra/.env)
          set +a
          sed -i "s|image: ${{ matrix.image }}:.*|image: ${{ matrix.image }}:${{ github.sha }}|g" infra/docker/prod/imagenes.yml
          if docker compose --project-directory "$PWD" --project-name marketplace -f infra/docker/prod/imagenes.yml build "${{ matrix.service }}" --push; then
            if docker manifest inspect "${{ matrix.image }}:${{ github.sha }}" >/dev/null 2>&1; then
              git tag -f "${{ matrix.tag }}" "$GITHUB_SHA"
              if git push origin "refs/tags/${{ matrix.tag }}" --force; then
                STATUS="SUCCESS"
              else
                STATUS="TAG_PUSH_ERROR"
              fi
            else
              STATUS="VERIFY_FAILED"
            fi
          else
            STATUS="FAILED"
          fi
          echo "${{ matrix.prefix }}_BUILD=$STATUS" >> "$GITHUB_ENV"
          echo "Resultado build $SERVICE: $STATUS"

  deploy:
    name: Update environment variables on Manager
    runs-on: ubuntu-22.04
    needs: [build_all]
    permissions:
      contents: write
    # if: ${{ always() }}
    if: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Esperar bootstrap
        run: |
          timeout 300 ssh -o StrictHostKeyChecking=no root@${{ vars.MANAGER_IP }} '
            while [ ! -f /root/bootstrap-complete ]; do
              sleep 5
            done

            echo "Bootstrap completado"
          '

      - name: Copiar .env base
        run: |
          scp -o StrictHostKeyChecking=no infra/.env root@${{ vars.MANAGER_IP }}:/root/.env

      - name: Configurar variables de producción
        run: |
          ssh root@${{ vars.MANAGER_IP }} "
          cat >> /root/.env <<EOF
          PROFILE=${{ vars.PROFILE }}
          HOST_EXTERNAL=${{ vars.MANAGER_IP }}
          VITE_MOCK=${{ vars.VITE_MOCK }}
          PORT_EXTERNAL=${{ vars.PORT_EXTERNAL }}
          NETWORK_APPLICATION=${{ vars.NETWORK_APPLICATION }}
          TAG=${{ vars.TAG }}
          MONITOREO=${{ vars.MONITOREO }}
          EOF
          "
      - name: Crear config en Docker Swarm
        continue-on-error: true
        run: |
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh redis_config
          ' < infra/docker/config/redis/redis.conf
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh hydra_entrypoint
          ' < infra/docker/config/hydra/entrypoint.sh
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh traefik_tls
          ' < infra/docker/config/traefik/dynamic/tls_prod.yml
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh alloy_config
          ' < infra/docker/config/alloy/config.alloy
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh postgres_exporter_custom_queries
          ' < infra/docker/config/postgres_exporter/custom_queries.yml
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh loki_config
          ' < infra/docker/config/loki/loki-config.yaml
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh rabbitmq_init
          ' < infra/docker/config/rabbitmq/init_rabbitmq.sh
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh flyway_entrypoint
          ' < flyway/deploy/entrypoint.sh
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-config.sh mTLS_ca
          ' < infra/docker/config/traefik/mTLS/ca.crt
      - name: Crear secrets en Docker Swarm
        continue-on-error: true
        run: |
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh postgres_password
          ' < <(printf "%s" "${{ secrets.POSTGRES_PASSWORD }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh client_id
          ' < <(printf "%s" "${{ secrets.CLIENT_ID }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh google_oauth2_client_id
          ' < <(printf "%s" "${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh hydra_secret
          ' < <(printf "%s" "${{ secrets.HYDRA_SECRET }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh client_secret
          ' < <(printf "%s" "${{ secrets.CLIENT_SECRET }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh google_oauth2_client_secret
          ' < <(printf "%s" "${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh traefik_server_crt
          ' < <(printf "%s" "${{ secrets.TRAEFIK_SERVER_CRT }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh traefik_server_key
          ' < <(printf "%s" "${{ secrets.TRAEFIK_SERVER_KEY }}")
          ssh root@${{ vars.MANAGER_IP }} '
            bash /root/deploy-secret.sh pgadmin_default_password
          ' < <(printf "%s" "${{ secrets.PGADMIN_DEFAULT_PASSWORD }}")
        shell: bash

      - name: Generate image tags
        run: |
          git fetch --tags --force

          FRONT_SHA=$(git rev-parse push-front)
          BFF_SHA=$(git rev-parse push-bff)
          SCRAP_SHA=$(git rev-parse push-scrap)
          BEAT_SHA=$(git rev-parse push-beat)
          cp infra/docker/services.yml infra/docker/prod/services.generated.yml
          sed -i \
            -e "s|image: tcero76/demo-front:.*|image: tcero76/demo-front:${FRONT_SHA}|g" \
            -e "s|image: tcero76/demo-bff-service:.*|image: tcero76/demo-bff-service:${BFF_SHA}|g" \
            -e "s|image: tcero76/demo-scrap-service:.*|image: tcero76/demo-scrap-service:${SCRAP_SHA}|g" \
            -e "s|image: tcero76/demo-beat-service:.*|image: tcero76/demo-beat-service:${BEAT_SHA}|g" \
            infra/docker/prod/services.generated.yml
          echo "===== services.generated.yml ====="
          cat infra/docker/prod/services.generated.yml

      - name: Copy docker/*.yml to manager
        run: |
          git fetch origin
          git reset --hard ${{ github.sha }}
          ssh -o StrictHostKeyChecking=no root@${{ vars.MANAGER_IP }} \
            "mkdir -p /root/docker"
          scp -o StrictHostKeyChecking=no \
            infra/docker/prod/acme.json \
            infra/docker/prod/common.yml \
            infra/docker/prod/hydra.yml \
            infra/docker/prod/monitoring.yml \
            infra/docker/prod/rabbitmq.yml \
            infra/docker/prod/postgres.yml \
            infra/docker/prod/redis.yml \
            infra/docker/prod/traefik.yml \
            infra/docker/prod/services.prod.yml \
            root@${{ vars.MANAGER_IP }}:/root/docker/
          
          scp -o StrictHostKeyChecking=no \
            infra/docker/prod/services.generated.yml \
            root@${{ vars.MANAGER_IP }}:/root/docker/services.yml

      - name: update flyway migrations
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ vars.MANAGER_IP }} \
            "mkdir -p /root/flyway/sql"
          scp -o StrictHostKeyChecking=no -r \
            flyway/sql/migration \
            flyway/sql/seed \
            root@${{ vars.MANAGER_IP }}:/root/flyway/sql/

      - name: excecute deploy
        run: ssh -o StrictHostKeyChecking=no root@${{ vars.MANAGER_IP }} "
            /root/deploy_stack.sh
          "
          echo "Desplegado"
      - name: Mark deployed commit
        run: |
          git tag -f deploy-prod HEAD
          git push origin deploy-prod --force

  report:
    name: Reporte Variables
    runs-on: ubuntu-22.04
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Debug git build
        run: scripts/workflow/report.sh
