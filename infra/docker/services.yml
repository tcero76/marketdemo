services:
  bff-service:
    image: tcero76/demo-bff-service:${TAG}
    build:
      dockerfile: ./bff-service/deploy/Dockerfile
      context: .
      target: ${PROFILE}
  front:
    image: tcero76/demo-front:${TAG}
    build:
      dockerfile: deploy/Dockerfile
      context: ./front
      target: ${PROFILE}
      args:
        NEXT_PUBLIC_HOST: ${PROTOCOL_EXTERNAL}://${HOST_EXTERNAL}
        NEXT_PUBLIC_WS: ${PROTOCOL_WS_EXTERNAL}://${HOST_EXTERNAL}
        NEXT_PUBLIC_HYDRA: ${PROTOCOL_EXTERNAL}://auth.${HOST_EXTERNAL}
        NEXT_PUBLIC_CLIENT_ID: ${CLIENT_ID}
        NEXT_PUBLIC_MOCK: ${VITE_MOCK}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
        NEXT_PUBLIC_HOME_PAGE_PATH: ${HOME_PAGE_PATH}
  scrap-service:
    image: tcero76/demo-scrap-service:${TAG}
    build:
      dockerfile: ./scrap-service/deploy/Dockerfile
      context: .
      target: ${PROFILE}
  beat-service:
    image: tcero76/demo-beat-service:${TAG}
    build:
      dockerfile: beat-service/deploy/Dockerfile
      context: .
      target: ${PROFILE}