services:
  bff-service:
    image: tcero76/demo-bff-service:dev
    build:
      dockerfile: ./bff-service/deploy/Dockerfile
      context: .
      target: ${PROFILE}
  front:
    image: tcero76/demo-front:dev
    build:
      dockerfile: deploy/Dockerfile
      context: ./front
      target: ${PROFILE}
      args:
        VITE_HOST: "${PROTOCOL_EXTERNAL}://${HOST_EXTERNAL}:${PORT_EXTERNAL}"
        VITE_WS: "ws://${HOST_EXTERNAL}:${PORT_EXTERNAL}"
        VITE_CLIENT_ID: "${CLIENT_ID}"
        VITE_MOCK: ${VITE_MOCK}