services:
  db:
    image: timescale/timescaledb:${TIMESCALEDB_VERSION}
    container_name: db
    profiles: ["postgres"]
    command: >
      postgres
      -c shared_preload_libraries=timescaledb,pg_stat_statements
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # ports:
    #   - 5432:5432
    environment:
     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
     - POSTGRES_USER=${POSTGRES_USER}
     - POSTGRES_DB=${POSTGRES_DB}
     - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ${NETWORK_APPLICATION:-application}
  pgadmin:
      image: dpage/pgadmin4:${PGADMIN_VERSION}
      container_name: pgadmin
      profiles: ["postgres"]
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
        PGADMIN_CONFIG_SERVER_MODE: "True"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
      depends_on:
        db:
          condition: service_healthy
      networks:
        - ${NETWORK_APPLICATION:-application}
      labels:
        - traefik.enable=true
        - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${HOST_EXTERNAL}`)
        - traefik.http.routers.pgadmin.entrypoints=websecure
        - traefik.http.routers.pgadmin.tls=true
        - traefik.http.routers.pgadmin.tls.certresolver=le
        - traefik.http.routers.pgadmin.tls.options=admin-mtls@file
        - traefik.http.services.pgadmin.loadbalancer.server.port=80
