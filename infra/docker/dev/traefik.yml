services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: traefik
    profiles:
      - traefik
    command:
      - "--ping=true"
      - "--api.dashboard=true"

      # Metrics
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--entrypoints.metrics.address=:8082"

      # HTTP / HTTPS
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # RTMP
      # - "--entrypoints.rtmp.address=:1935"

      # HTTP -> HTTPS 
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt
      # - "--certificatesresolvers.le.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.le.acme.email=admin@${HOST_EXTERNAL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"

      # Dynamic configuration
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    ports:
      - "80:80"
      - "443:443"
      # - "1935:1935"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/docker/config/traefik/dynamic/tls.yml:/etc/traefik/dynamic/tls.yml
      - ~/.environments/certs:/certs
      - ./infra/docker/config/traefik/acme.json:/letsencrypt/acme.json
    networks:
      application:
      proxy:
        ipv4_address: 172.30.0.10
    labels:
      - traefik.enable=true

      - traefik.http.routers.traefik.rule=Host(`traefik.${HOST_EXTERNAL}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.options=admin-mtls@file
      - traefik.http.routers.traefik.tls.certresolver=le
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.priority=100

      - traefik.http.routers.root.rule=Host(`${HOST_EXTERNAL}`)
      - traefik.http.routers.root.entrypoints=websecure
      - traefik.http.routers.root.tls=true
      - traefik.http.routers.root.tls.certresolver=le
      - traefik.http.routers.root.service=mi-servicio
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5