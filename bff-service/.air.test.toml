root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go vet ./${TEST_PACKAGE:-controller}/..."
  full_bin = "go test -count=1 -v -run '^TestGetProduct$' ./${TEST_PACKAGE:-controller}/... controller.TestGetProduct" 
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  include_ext = ["go"]
  include_file = []
  kill_delay = "0s"
  log = "test-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false
  include_dir = [
    ".",
    "../postgres/",
    "../rabbitmq/",
    "../config/",
    "../redis/"
  ]

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = false